# ==============================================================================
# Pipeline CI : Express.js (Node.js)
# Installe les dépendances npm, exécute l'analyse ESLint et lance les tests
# ==============================================================================
name: Express.js CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Lint & Test (Node.js 20)
    runs-on: ubuntu-latest

    # Application du principe du moindre privilège (DevSecOps)
    permissions:
      contents: read

    steps:
      # 1. Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration de l'environnement Node.js 20 avec cache npm
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: express-api/package-lock.json

      # 3. Installation propre et déterministe des dépendances
      - name: Install Dependencies
        run: npm ci --prefix express-api

      # 4. Analyse statique du code avec ESLint
      # continue-on-error: false force l'arrêt immédiat en cas d'erreurs de lint
      - name: Lint Code
        run: npm run lint --prefix express-api
        continue-on-error: false

      # 5. Exécution de la suite de tests unitaires / intégration
      - name: Run Tests
        run: npm test --prefix express-api
